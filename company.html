<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company — Nexjob</title>
  <meta name="description" content="A company profile with its open roles, pay bands and hiring route.">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232B36C4'/%3E%3Cg stroke='%23fff' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M5 18h14'/%3E%3Cpath d='M8 18v-2.5M12 18v-5M16 18v-7.5'/%3E%3C/g%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Sans:wght@400..700&family=Martian+Mono:wght@300..700&display=swap">

  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/layout.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/pages.css">

  <!-- Applies the stored theme before first paint, so the page never flashes
       the wrong one. Falls back to the operating system preference. -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('nexjob:v2:theme');
        var t = raw ? JSON.parse(raw) : null;
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* private mode — the stylesheet default applies */ }
    })();
  </script>
</head>

<body data-page="company">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="mast">
    <div class="wrap mast-in">
      <a class="brand" href="./index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M3 18h18" />
            <path d="M7 18v-3M12 18v-6M17 18v-9" />
          </svg>
        </span>
        <span class="brand-name">Nexjob</span>
      </a>

      <nav class="mast-nav" aria-label="Primary">
        <ul>
          <li><a class="mast-link" href="./jobs.html" data-nav="jobs">Jobs</a></li>
          <li><a class="mast-link" href="./companies.html" data-nav="companies">Companies</a></li>
          <li><a class="mast-link" href="./prep.html" data-nav="prep">Get in</a></li>
          <li><a class="mast-link" href="./salaries.html" data-nav="salaries">Pay</a></li>
        </ul>
      </nav>

      <div class="mast-side">
        <button type="button" class="ibtn" data-theme-toggle aria-label="Switch theme">
          <span data-icon-sun hidden>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </span>
          <span data-icon-moon>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </span>
        </button>

        <div data-account-slot></div>

        <a class="btn btn--primary btn--sm only-wide" href="./post-job.html">Post a role</a>

        <button type="button" class="ibtn mast-burger" data-drawer-open aria-expanded="false" aria-controls="drawer"
          aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <path d="M3 6h18M3 12h18M3 18h18" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="wrap" style="padding-top:var(--s5)">
      <a class="tick" href="./companies.html" style="text-decoration:none">&larr; All companies</a>
    </div>

    <section class="strip strip--tight" style="padding-top:var(--s4)">
      <div class="wrap" id="co-root">
        <div class="skeleton" style="height:220px"></div>
      </div>
    </section>
  </main>

  <footer class="foot" id="site-foot"></footer>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="./assets/js/pages/company.js"></script>
</body>

</html>
