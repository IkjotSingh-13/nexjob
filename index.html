<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexjob — every salary on one scale</title>
  <meta name="description"
    content="A job board for engineering, design, product and data roles that draws every salary band on the same scale, so you can see where a role really sits before you apply.">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232B36C4'/%3E%3Cg stroke='%23fff' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M5 18h14'/%3E%3Cpath d='M8 18v-2.5M12 18v-5M16 18v-7.5'/%3E%3C/g%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Sans:wght@400..700&family=Martian+Mono:wght@300..700&display=swap">

  <!-- Applies the stored theme before first paint, so the page never flashes
       the wrong one. Falls back to the operating system preference. React takes
       over from here (src/context/ThemeContext.jsx) once it has mounted. -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('nexjob:v2:theme');
        var t = raw ? JSON.parse(raw) : null;
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* private mode — the stylesheet default applies */ }
    })();
  </script>
</head>

<body>
  <div id="root"></div>

  <noscript>
    <p style="padding:2rem;font-family:sans-serif">Nexjob is a React application and needs JavaScript to run.</p>
  </noscript>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
