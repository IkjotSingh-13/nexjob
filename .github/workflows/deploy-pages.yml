name: Deploy Nexjob to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the current app
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read the Pages URL and project path
        id: pages
        uses: actions/configure-pages@v5

      - name: Install locked dependencies
        run: npm ci

      - name: Build and verify the publish directory
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm run build
          npm run test:deployment

      - name: Upload only the compiled website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
